name: Scrape

# Keeps data/ current without anyone's PC: scrape, commit, redeploy the page, alert.
# Cron times are UTC. Draws are at 10:30 PM Eastern (02:30 UTC in summer, 03:30 in winter).
on:
  schedule:
    - cron: "17 11 * * *"        # every morning, 7:17 AM EDT / 6:17 AM EST
    - cron: "17 21 * * 2,3,5,6"  # draw-day afternoons: jackpot estimates sometimes rise
    - cron: "17 4 * * 0,3,4,6"   # after the Tue/Wed/Fri/Sat draws...
    - cron: "47 6 * * 0,3,4,6"   # ...and again once results are surely posted
  workflow_dispatch:

permissions:
  contents: write  # commit data/
  issues: write    # alerts

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Scrape
        run: |
          cp data/next.json "$RUNNER_TEMP/previous-next.json"
          set +e
          python scrape.py 2>&1 | tee "$RUNNER_TEMP/scrape.log"
          echo "Exit status ${PIPESTATUS[0]}"
          { echo '```'; cat "$RUNNER_TEMP/scrape.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update lottery data"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

      - name: Alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          VALUE_ALERT_THRESHOLD: ${{ vars.VALUE_ALERT_THRESHOLD }}
        run: python alert.py --previous "$RUNNER_TEMP/previous-next.json" --log "$RUNNER_TEMP/scrape.log"

  deploy:
    needs: scrape
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
