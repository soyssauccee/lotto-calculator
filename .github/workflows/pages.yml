name: Deploy page

# Publishes index.html, web/ and data/ to GitHub Pages. Runs on pushes to main,
# by hand, and from the scheduled scrape (which calls it after committing new data,
# since pushes made with GITHUB_TOKEN don't start other workflows).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04  # pinned: unattended jobs shouldn't change OS under us
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # when called after a scrape, include the data it just committed
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html web data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
